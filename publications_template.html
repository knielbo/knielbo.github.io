<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body bgcolor="white" text="black" link="blue" vlink="blue" alink="blue">

<h1>Publications</h1>

<details id="research-areas">
  <summary id="research-area-title"><span>Research areas over time (<span data-area-years></span>)</span></summary>
  <figure aria-labelledby="research-area-title">
    <p class="dot-key area-small"><span aria-hidden="true"></span>One dot per research output. Select a group to read its titles.</p>
    <div class="year-blocks"></div>
    <noscript>The full list of publications appears below, ordered by year.</noscript>
    <figcaption class="area-small area-muted"><span data-area-count></span> research outputs · Aarhus University Pure<span data-area-export></span></figcaption>
    <details class="area-note area-small">
      <summary>About the research areas</summary>
      <p>Each output appears once, under its primary research area. The “AI &amp; language technology” row groups work that studies AI systems and language technology themselves.</p>
    </details>
  </figure>
</details>
<script type="application/json" id="research-area-data"></script>

<div id="publication-list"></div>
